name: directus-extensions-e2e

services:
  database:
    image: ghcr.io/clevercactus-dev/docker-lean-postgis:RELEASE.2026-02-22T21-30-34Z
    shm_size: 1gb
    volumes:
      - directus-extensions-e2e-database:/var/lib/postgresql
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: p4ssw0rd!
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}"']
      interval: 5s
      timeout: 20s
      retries: 20

  directus:
    image: directus/directus:12.2.0
    ports:
      - '${DIRECTUS_E2E_PORT:-18055}:8055'
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ../extensions:/directus/extensions:ro
    environment:
      PUBLIC_URL: http://localhost:${DIRECTUS_E2E_PORT:-18055}
      SECRET: directus-extensions-e2e-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: p4ssw0rd!
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: p4ssw0rd!
      EXTENSIONS_MUST_LOAD: 'true'
      EXTENSIONS_AUTO_RELOAD: 'false'
      TELEMETRY: 'false'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:8055/server/ping']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  directus-extensions-e2e-database:
