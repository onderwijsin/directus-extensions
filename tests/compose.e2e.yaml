name: directus-extensions-e2e

services:
  coolify-mock:
    image: node:24.10.0-alpine
    restart: 'no'
    command: ['node', '/opt/coolify-mock/server.mjs']
    volumes:
      - ../tests/coolify-mock/server.mjs:/opt/coolify-mock/server.mjs:ro
    networks:
      - backend

  database:
    restart: 'no'
    volumes:
      - directus-extensions-e2e-database:/var/lib/postgresql

  cache:
    restart: 'no'
    volumes:
      - directus-extensions-e2e-cache:/data

  mailpit:
    ports:
      - '127.0.0.1:${DIRECTUS_E2E_MAILPIT_PORT:-18025}:8025'
    volumes:
      - directus-extensions-e2e-mailpit:/data

  garage:
    volumes:
      - directus-extensions-e2e-garage-meta:/var/lib/garage/meta
      - directus-extensions-e2e-garage-data:/var/lib/garage/data

  garage-init:
    volumes:
      - directus-extensions-e2e-garage-meta:/var/lib/garage/meta:ro

  meilisearch:
    volumes:
      - directus-extensions-e2e-meilisearch:/meili_data

  directus:
    ports:
      - '127.0.0.1:${DIRECTUS_E2E_PORT:-18055}:8055'
    depends_on:
      cache:
        condition: service_healthy
      database:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      meilisearch:
        condition: service_healthy
      coolify-mock:
        condition: service_started
    volumes:
      - '${DIRECTUS_E2E_EXTENSIONS_DIR:-../extensions}:/directus/extensions:ro'
      - '${DIRECTUS_E2E_EMAIL_TEMPLATES_DIR:-../extensions/directus-magic-links-bundle/templates}:/directus/templates:ro'
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${DIRECTUS_E2E_PORT:-18055}}
      SECRET: ${DIRECTUS_SECRET:-directus-extensions-e2e-secret}
      # Disabled by default; CI may provide a license key explicitly.
      LICENSE_KEY: ${LICENSE_KEY:-}
      EXTENSIONS_AUTO_RELOAD: 'false'
      MAGIC_LINKS_ENABLED: 'true'
      MAGIC_LINKS_COLLECTION: custom_links
      COOLIFY_DEPLOYMENTS_ENABLED: 'true'
      COOLIFY_URL: 'http://coolify-mock:3000'
      COOLIFY_TOKEN: 'e2e-unused-token'
      USE_MAGIC_LINK_CLEANUP: 'true'
      MAGIC_LINK_CLEANUP_WINDOW: 1ms
      MAGIC_LINK_CLEANUP_CRON: '* * * * * *'
      SLUGGERNAUT_ENABLED: 'true'
      SLUGGERNAUT_REDIRECTS_ENABLED: 'true'
      SLUGGERNAUT_SCHEMA_CHANGES_ENABLED: 'true'
      # Core-plan E2E coverage does not need optional redirect policies. Their filtered
      # permission rules require a restricted Directus resource, so keep policy seeding off.
      SLUGGERNAUT_MANAGE_REDIRECTS_POLICY_ENABLED: 'false'
      SLUGGERNAUT_READ_ACTIVE_REDIRECTS_POLICY_ENABLED: 'false'
      SLUGGERNAUT_REDIRECTS_COLLECTION: redirects
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:8055/server/ping']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  directus-extensions-e2e-database:
  directus-extensions-e2e-cache:
  directus-extensions-e2e-mailpit:
  directus-extensions-e2e-garage-meta:
  directus-extensions-e2e-garage-data:
  directus-extensions-e2e-meilisearch:
