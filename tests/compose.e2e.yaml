name: directus-extensions-e2e

include:
  - path: ../docker/compose.base.yaml
  - path: ../docker/compose.database.yaml
  - path: ../docker/compose.cache.yaml
  - path: ../docker/compose.directus.yaml
  - path: ../docker/compose.mailpit.yaml

services:
  database:
    restart: 'no'
    volumes:
      - directus-extensions-e2e-database:/var/lib/postgresql

  cache:
    restart: 'no'
    volumes:
      - directus-extensions-e2e-cache:/data

  mailpit:
    volumes:
      - directus-extensions-e2e-mailpit:/data

  directus:
    ports:
      - '${DIRECTUS_E2E_PORT:-18055}:8055'
    depends_on:
      cache:
        condition: service_healthy
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - '${DIRECTUS_E2E_EXTENSIONS_DIR:-../extensions}:/directus/extensions:ro'
    environment:
      PUBLIC_URL: http://localhost:${DIRECTUS_E2E_PORT:-18055}
      SECRET: directus-extensions-e2e-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: p4ssw0rd!
      EXTENSIONS_MUST_LOAD: 'true'
      EXTENSIONS_AUTO_RELOAD: 'false'
      EMAIL_TRANSPORT: smtp
      EMAIL_FROM: noreply@localhost
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: 1025
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:8055/server/ping']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  directus-extensions-e2e-database:
  directus-extensions-e2e-cache:
  directus-extensions-e2e-mailpit:
