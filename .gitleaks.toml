title = "Gitleaks Configuration"
description = "Security scanning configuration for TypeScript project"

[extend]
useDefault = true

[[allowlists]]
description = "Pinned Valkey image tags are not API keys"
condition = "AND"
regexTarget = "line"
paths = ['''(?:docker/compose\.cache\.yaml|compose\.yaml)$''']
regexes = [
	'''^[[:space:]]*image:[[:space:]]*valkey/valkey:[0-9]+\.[0-9]+\.[0-9]+-alpine[0-9]+\.[0-9]+[[:space:]]*(?:#.*)?$''',
]

# Global allowlists for the project
[[allowlists]]
description = "Project ignore paths and patterns"
paths = [
	'''node_modules/.*''',
	'''\.git/.*''',
	'''dist/.*''',
	'''\.output/.*''',
	'''coverage/.*''',
	'''.*\.log$''',
	'''\.env\.example$''',
	'''\.env\.template$''',
	'''public/.*\.json$''',
	'''assets/.*\.svg$''',
	'''data/.*''',
	'''\.agents/skills/.*''',
]
