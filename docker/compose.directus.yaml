services:
  directus:
    image: directus/directus:12.2.0
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      SECRET: ${DIRECTUS_SECRET:-development-only-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-p4ssw0rd!}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DEFAULT_PASSWORD:-p4ssw0rd!}
      DB_POOL__MIN: ${DB_POOL__MIN:-0}
      DB_POOL__MAX: ${DB_POOL__MAX:-10}
      REDIS: redis://default:${DEFAULT_PASSWORD:-p4ssw0rd!}@cache:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_STORE: ${CACHE_STORE:-redis}
      CACHE_AUTO_PURGE: ${CACHE_AUTO_PURGE:-true}
      SYNCHRONIZATION_STORE: ${SYNCHRONIZATION_STORE:-redis}
      SYNCHRONIZATION_NAMESPACE: ${SYNCHRONIZATION_NAMESPACE:-directus-sync}
      FILES_MAX_UPLOAD_SIZE: ${FILES_MAX_UPLOAD_SIZE:-200mb}
      TUS_ENABLED: ${TUS_ENABLED:-true}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-true}
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC:
        "${CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC:-'self' http://localhost:*}"
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_ANCESTORS:
        "${CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_ANCESTORS:-'self' http://localhost:*}"
      HSTS_ENABLED: ${HSTS_ENABLED:-true}
      MARKETPLACE_TRUST: ${MARKETPLACE_TRUST:-sandbox}
      EXTENSIONS_AUTO_RELOAD: ${EXTENSIONS_AUTO_RELOAD:-true}
      WEBSOCKETS_ENABLED: ${WEBSOCKETS_ENABLED:-true}
      TELEMETRY: ${TELEMETRY:-false}
    networks:
      - frontend
      - backend
