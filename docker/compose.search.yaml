services:
  meilisearch:
    image: getmeili/meilisearch:v1.15.2
    restart: unless-stopped
    ports:
      - '7700:7700'
    volumes:
      - ../.data/meilisearch:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-development-meilisearch-key}
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
