networks:
  frontend:
  backend:

services:
  database:
    image: ghcr.io/clevercactus-dev/docker-lean-postgis:RELEASE.2026-02-22T21-30-34Z
    restart: unless-stopped
    shm_size: 1gb
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 512M
    command: >-
      postgres -c config_file=/etc/postgresql/postgresql.conf -c ssl=off
    configs:
      - source: postgres-config
        target: /etc/postgresql/postgresql.conf
        mode: 0644
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}"']
      interval: 5s
      timeout: 20s
      retries: 10
    environment:
      POSTGRES_DB: ${DB_NAME:-directus}
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DEFAULT_PASSWORD:-p4ssw0rd!}
    networks:
      - backend

  cache:
    image: valkey/valkey:9.1.1-alpine3.24
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    command:
      redis-server /usr/local/etc/redis/redis.conf --requirepass ${DEFAULT_PASSWORD:-p4ssw0rd!}
    configs:
      - source: redis-config
        target: /usr/local/etc/redis/redis.conf
        mode: 0644
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${DEFAULT_PASSWORD:-p4ssw0rd!}
      REDIS_USERNAME: default
    networks:
      - backend

  directus:
    image: directus/directus:12.2.0
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      SECRET: ${DIRECTUS_SECRET:-development-only-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-p4ssw0rd!}
      LICENSE_KEY: ${LICENSE_KEY:-}
      EXTENSIONS_MUST_LOAD: ${EXTENSIONS_MUST_LOAD:-true}

      # Database
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DEFAULT_PASSWORD:-p4ssw0rd!}
      DB_POOL__MIN: ${DB_POOL__MIN:-0}
      DB_POOL__MAX: ${DB_POOL__MAX:-10}

      # Store
      REDIS: redis://default:${DEFAULT_PASSWORD:-p4ssw0rd!}@cache:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_STORE: ${CACHE_STORE:-redis}
      CACHE_AUTO_PURGE: ${CACHE_AUTO_PURGE:-true}
      SYNCHRONIZATION_STORE: ${SYNCHRONIZATION_STORE:-redis}
      SYNCHRONIZATION_NAMESPACE: ${SYNCHRONIZATION_NAMESPACE:-directus-sync}

      # Files
      FILES_MAX_UPLOAD_SIZE: ${FILES_MAX_UPLOAD_SIZE:-200mb}
      TUS_ENABLED: ${TUS_ENABLED:-true}
      STORAGE_LOCATIONS: bucket
      STORAGE_BUCKET_DRIVER: s3
      STORAGE_BUCKET_KEY: ${GARAGE_ACCESS_KEY_ID:-directus}
      STORAGE_BUCKET_SECRET: ${GARAGE_SECRET_ACCESS_KEY:-directus-development-secret}
      STORAGE_BUCKET_ENDPOINT: http://garage:3900
      STORAGE_BUCKET_BUCKET: ${STORAGE_BUCKET:-directus}
      STORAGE_BUCKET_REGION: ${STORAGE_REGION:-garage}
      STORAGE_BUCKET_FORCE_PATH_STYLE: 'true'
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC:
        "${CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC:-'self' http://localhost:*}"
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_ANCESTORS:
        "${CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_ANCESTORS:-'self' http://localhost:*}"
      HSTS_ENABLED: ${HSTS_ENABLED:-true}

      # Misc
      MARKETPLACE_TRUST: ${MARKETPLACE_TRUST:-sandbox}
      EXTENSIONS_AUTO_RELOAD: ${EXTENSIONS_AUTO_RELOAD:-true}
      WEBSOCKETS_ENABLED: ${WEBSOCKETS_ENABLED:-true}
      TELEMETRY: ${TELEMETRY:-false}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-true}
      MIGRATIONS_PATH: /directus/migrations

      # Email
      EMAIL_TRANSPORT: smtp
      EMAIL_TEMPLATES_PATH: /directus/templates
      EMAIL_FROM: ${EMAIL_FROM:-noreply@localhost}
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: 1025

      # Search
      MEILISEARCH_HOST_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-development-meilisearch-key}

      ## Sentry integration
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}

      # Magic links
      MAGIC_LINKS_REDIRECT_URL_ALLOWLIST: 'array:https://app.example.com/auth/magic-link'
      MAGIC_LINKS_TOKEN_SECRET: ${MAGIC_LINKS_TOKEN_SECRET:-development-magic-links-secret}

      # Coolify integration
      COOLIFY_DEPLOYMENTS_ENABLED: ${COOLIFY_DEPLOYMENTS_ENABLED:-true}
      COOLIFY_APPLICATIONS_COLLECTION: ${COOLIFY_APPLICATIONS_COLLECTION:-coolify_applications}
      COOLIFY_DEPLOYMENTS_SCHEMA_CHANGES_ENABLED: ${COOLIFY_DEPLOYMENTS_SCHEMA_CHANGES_ENABLED:-true}
      COOLIFY_DEPLOYMENTS_SCHEMA_ABORT_ON_ERROR: ${COOLIFY_DEPLOYMENTS_SCHEMA_ABORT_ON_ERROR:-true}
      COOLIFY_URL: ${COOLIFY_URL:-}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:-}

      # Sluggernaut extension
      SLUGGERNAUT_REDIRECTS_ENABLED: ${SLUGGERNAUT_REDIRECTS_ENABLED:-true}
      SLUGGERNAUT_SCHEMA_CHANGES_ENABLED: ${SLUGGERNAUT_SCHEMA_CHANGES_ENABLED:-true}
      SLUGGERNAUT_MANAGE_REDIRECTS_POLICY_ENABLED: ${SLUGGERNAUT_MANAGE_REDIRECTS_POLICY_ENABLED:-true}
      SLUGGERNAUT_READ_ACTIVE_REDIRECTS_POLICY_ENABLED: ${SLUGGERNAUT_READ_ACTIVE_REDIRECTS_POLICY_ENABLED:-true}
      SLUGGERNAUT_REDIRECTS_COLLECTION: ${SLUGGERNAUT_REDIRECTS_COLLECTION:-redirects}
    networks:
      - frontend
      - backend
    volumes:
      - ../migrations:/directus/migrations:ro

  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    networks:
      - backend

  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    restart: unless-stopped
    configs:
      - source: garage-config
        target: /etc/garage.toml
        mode: 0644
    networks:
      - backend

  garage-init:
    build:
      context: ..
      dockerfile: docker/garage-init.Dockerfile
    restart: 'no'
    depends_on:
      garage:
        condition: service_started
    configs:
      - source: garage-config
        target: /etc/garage.toml
        mode: 0644
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-directus}
      STORAGE_REGION: ${STORAGE_REGION:-garage}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-directus}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-directus-development-secret}
    networks:
      - backend

  meilisearch:
    image: getmeili/meilisearch:v1.53.0
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-development-meilisearch-key}
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

configs:
  postgres-config:
    content: |
      listen_addresses = '*'
      io_method = 'worker'
      io_workers = 4
      shared_buffers = 1GB
      effective_cache_size = 8GB
      work_mem = 32MB
      maintenance_work_mem = 512MB
      max_worker_processes = 8
      max_parallel_workers = 8
      max_parallel_workers_per_gather = 4
      max_parallel_maintenance_workers = 4
      random_page_cost = 1.1
      effective_io_concurrency = 200
      wal_buffers = 16MB
      min_wal_size = 512MB
      max_wal_size = 2GB
      checkpoint_timeout = 10min
      checkpoint_completion_target = 0.9
      fsync = on
      synchronous_commit = on
      full_page_writes = on
      log_min_duration_statement = 500
      log_line_prefix = '%t [%p]: '
      log_statement = 'none'
      autovacuum = on
      autovacuum_naptime = 60s
      shared_preload_libraries = 'pg_stat_statements'
      pg_stat_statements.track = all

  redis-config:
    content: |
      maxmemory 2gb
      maxmemory-policy allkeys-lru
      appendonly no
      save 900 1
      save 300 100
      save 60 1000
      io-threads 2
      io-threads-do-reads yes
      activedefrag yes
      lazyfree-lazy-eviction yes
      lazyfree-lazy-expire yes
      lazyfree-lazy-server-del yes
      lazyfree-lazy-user-del no
      tcp-backlog 511
      hz 10

  garage-config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "${STORAGE_HOST:-garage}:3901"
      rpc_secret = "${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"

      [s3_api]
      s3_region = "${STORAGE_REGION:-garage}"
      api_bind_addr = "[::]:3900"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token = "${GARAGE_ADMIN_TOKEN:-development-garage-admin-token}"
      metrics_token = "${GARAGE_METRICS_TOKEN:-development-garage-metrics-token}"
