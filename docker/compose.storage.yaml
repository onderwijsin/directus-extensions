services:
  garage:
    # Keep this image version in sync with the Garage CLI downloaded by garage-init.
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    volumes:
      - ../.data/garage/meta:/var/lib/garage/meta
      - ../.data/garage/data:/var/lib/garage/data
    configs:
      - source: garage-config
        target: /etc/garage.toml
        mode: 0644
    networks:
      - backend

  garage-init:
    image: alpine:3.22
    restart: on-failure
    depends_on:
      garage:
        condition: service_started
    volumes:
      - ../.data/garage/meta:/var/lib/garage/meta:ro
      - ./garage-init.sh:/usr/local/bin/garage-init.sh:ro
    configs:
      - source: garage-config
        target: /etc/garage.toml
        mode: 0644
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-directus}
      STORAGE_REGION: ${STORAGE_REGION:-garage}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-directus}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-directus-development-secret}
    command: ['/bin/sh', '/usr/local/bin/garage-init.sh']
    networks:
      - backend

configs:
  garage-config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "${STORAGE_HOST:-garage}:3901"
      rpc_secret = "${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"

      [s3_api]
      s3_region = "${STORAGE_REGION:-garage}"
      api_bind_addr = "[::]:3900"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token = "${GARAGE_ADMIN_TOKEN:-development-garage-admin-token}"
      metrics_token = "${GARAGE_METRICS_TOKEN:-development-garage-metrics-token}"
