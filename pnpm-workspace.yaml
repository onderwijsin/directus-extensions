packages:
  - extensions/*
  - packages/*
  - tests/*

catalog:
  '@types/express': 4.17.21
  '@directus/errors': 2.5.0
  '@directus/memory': 4.0.2
  '@directus/types': 16.1.0
  '@directus/utils': 13.5.2
  # Upgrading would require node ">=24.15.0" while we are on ">=24.10.0"
  eslint-plugin-jsdoc: 62.4.0
  '@changesets/changelog-git': 1.0.0
  '@changesets/cli': 3.0.0
  '@vitejs/plugin-vue': 6.0.8
  '@commitlint/cli': 21.2.2
  '@commitlint/config-conventional': 21.2.2
  husky: 9.1.7
  cron: 4.3.4
  lint-staged: 17.3.0
  oxfmt: 0.63.0
  oxlint: 1.78.0
  '@vitest/coverage-v8': 4.1.10
  publint: 0.3.23
  typescript: 5.9.3
  vitest: 4.1.10
  '@directus/extensions-sdk': 18.0.2
  '@vueuse/core': 14.0.0
  '@directus/sdk': 24.0.0
  '@onderwijsin/loops-core': 1.3.0
  happy-dom: 20.11.2
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  oxlint-tsgolint: 7.0.2001
  github-actionlint: 1.7.12
  tsdown: 0.22.14
  uuid: 14.0.1 # note: do not upgrade ioredis because of Directus, keep it at 5.8.2!
  ioredis: 5.8.2
  # note: do not upgrade pino because of Directus, keep it at 9.7.0!
  pino: 9.7.0
  '@sentry/node': 10.69.0
  '@sentry/profiling-node': 10.69.0
  # note: do not upgrade vue because of Directus, keep it at 3.5.24!
  vue: 3.5.24
  vue-tsc: 3.3.10
  vue-router: 4.6.3
  zod: 4.4.3
  ofetch: 1.5.1
  loops: 7.2.0
  ufo: 1.6.4
catalogs:
  node24:
    '@types/node': 24.13.3

catalogMode: strict
saveExact: true
cleanupUnusedCatalogs: true
verifyDepsBeforeRun: error

minimumReleaseAge: 144
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@onderwijsin/*'
allowBuilds:
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/node-cpu-profiler': true
  esbuild: true
  protobufjs: true
  sqlite3: true
  vue-demi: true
